name: Fly.io preview deployment for PR

on:
    pull_request:
        types: [opened, synchronize, reopened, closed]
        paths-ignore:
            - "**.md"
            - "test/**"

concurrency:
    group: fly-preview-pr-${{ github.event.pull_request.number }}
    cancel-in-progress: true

permissions:
    pull-requests: write
    contents: read

jobs:
    preview:
        runs-on: ubuntu-latest

        env:
            # an organization scoped FLY token is necessary to create and tear down preview deployments
            FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_PREVIEW }}
            FLY_ORG: ${{ vars.FLY_ORG }}
            APP_NAME: ai-implement-sandbox-pr-${{ github.event.pull_request.number }}
            NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        
        steps:
            - uses: actions/checkout@v4
            - uses: superfly/flyctl-actions/setup-flyctl@master

            - name: Deploy preview app
              if: github.event.action != 'closed'
              run: |
                # create app if not existing
                flyctl status --app "$APP_NAME" 2>/dev/null \
                    || flyctl apps create "$APP_NAME" --org "$FLY_ORG"
            
                # mirror secrets from production app
                flyctl secrets set --app "$APP_NAME" \
                    SITE_URL="https://${APP_NAME}.fly.dev" \
                    --stage

                # deploy without high availability on a single machine (low resources)
                flyctl deploy \
                    --local-only \
                    --app "$APP_NAME" \
                    --ha=false \
                    --build-arg NEXT_PUBLIC_SUPABASE_URL="$NEXT_PUBLIC_SUPABASE_URL" \
                    --build-arg NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY"
            
            - name: Post preview URL comment on deployment
              if: github.event.action != 'closed'
              uses: marocchino/sticky-pull-request-comment@v2
              with:
                header: fly-preview-pr
                message: |
                    ✨ Preview deployed to https://${{ env.APP_NAME }}.fly.dev

                    Commit: `${{ github.event.pull_request.head.sha }}`

            - name: Teardown preview app
              if: github.event.action == 'closed'
              run: flyctl apps destroy "$APP_NAME" --yes || true

            - name: Update comment on teardown
              if: github.event.action == 'closed'
              uses: marocchino/sticky-pull-request-comment@v2
              with:
                header: fly-preview-pr
                message: |
                    Preview deployment has been torn down (PR closed).